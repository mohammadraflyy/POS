name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build posnet for Android arm64
        working-directory: server/tailnet
        run: |
          mkdir -p ../../mobile/android/app/src/main/jniLibs/arm64-v8a
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -checklinkname=0" -o ../../mobile/android/app/src/main/jniLibs/arm64-v8a/libposnet.so .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Prepare Android Artifact
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk Point-of-Sales-Mobile.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Point-of-Sales-Mobile.apk

  build-windows:
    name: Build Windows Desktop (Flutter)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Desktop Release
        working-directory: mobile
        run: |
          flutter pub get
          flutter build windows --release

      - name: Build Windows Installer (.exe)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File mobile/windows/installer/build.ps1 -SkipFlutterBuild
          cp mobile/build/installer/Point-of-Sales-Setup-*.exe Point-of-Sales-Desktop-Setup.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: Point-of-Sales-Desktop-Setup.exe

  publish-release:
    name: Publish Release to GitHub
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Determine Tag Name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          files: |
            android-apk/Point-of-Sales-Mobile.apk
            windows-desktop/Point-of-Sales-Desktop-Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false


name: point_of_sales
description: POS mobile dengan pairing LAN dan kasir demo interaktif.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  mobile_scanner: 7.0.0
  # the shop PC runs the server inside this app (Windows only)
  pos_server:
    path: ../server
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # the screen gallery runs the real server in memory
  shelf: ^1.4.2
flutter:
  uses-material-design: true
  # Geist and Geist Mono (SIL OFL 1.1, assets/fonts/OFL.txt)
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
